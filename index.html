<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمود سلطان</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.25);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            color: #f8fafc;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid #334155;
            transition: all 0.2s ease-in-out;
        }

        .link-card:active {
            transform: scale(0.98);
            background: #334155;
        }

        .link-card i {
            font-size: 1.3rem;
            width: 25px;
        }

        .snapchat { color: #fffc00; }
        .instagram { color: #e1306c; }
        .telegram { color: #29a0da; }
        .facebook { color: #1877f2; }
        .whatsapp { color: #25d366; }

        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة الشخصية -->
        <img src="profile.jpg" alt="Profile" class="profile-img" onerror="this.src='https://via.placeholder.com/110/1e293b/38bdf8?text=Profile'">

        <!-- الاسم والوصف -->
        <h1>محمود سلطان</h1>
        <p class="subtitle">كلية الهندسة الكهربائية والإلكترونية | جامعة حلب</p>

        <!-- قائمة الروابط -->
        <div class="links-container">
            
            <a href="https://snapchat.com" target="_blank" class="link-card">
                <i class="fa-brands fa-snapchat snapchat"></i>
                <span>Snapchat</span>
                <i class="fa-solid fa-chevron-left" style="font-size: 0.8rem; opacity: 0.5;"></i>
            </a>

            <a href="https://instagram.com" target="_blank" class="link-card">
                <i class="fa-brands fa-instagram instagram"></i>
                <span>Instagram</span>
                <i class="fa-solid fa-chevron-left" style="font-size: 0.8rem; opacity: 0.5;"></i>
            </a>

            <a href="https://t.me" target="_blank" class="link-card">
                <i class="fa-brands fa-telegram telegram"></i>
                <span>Telegram</span>
                <i class="fa-solid fa-chevron-left" style="font-size: 0.8rem; opacity: 0.5;"></i>
            </a>

            <a href="https://facebook.com" target="_blank" class="link-card">
                <i class="fa-brands fa-facebook facebook"></i>
                <span>Facebook</span>
                <i class="fa-solid fa-chevron-left" style="font-size: 0.8rem; opacity: 0.5;"></i>
            </a>

            <a href="https://wa.me" target="_blank" class="link-card">
                <i class="fa-brands fa-whatsapp whatsapp"></i>
                <span>WhatsApp</span>
                <i class="fa-solid fa-chevron-left" style="font-size: 0.8rem; opacity: 0.5;"></i>
            </a>

        </div>

        <footer>
            © 2026 Mahmoud Sultan
        </footer>
    </div>

</body>
</html>
